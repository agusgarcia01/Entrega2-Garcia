<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style/info.css">
    <title>Info Recital</title>
</head>

<body class="info-layout">

    <header>
        <h1><span>TicketMaster</span></h1>
        <a href="user.html" id="iniciarSesion"><button>Iniciar Sesion</button></a>
        <button id="btnCarrito">
           🛒 <span id="contadorCarrito">0</span>
        </button>
    </header>

    <div id="carrito" class="carrito oculto">
        <h3>Tu Carrito</h3>
        <button id="btnCerrar">X</button>

        <ul id="listaCarrito"></ul>

        <p id="totalCarrito">Total: $0</p>
        <p id="timerCarrito" class="timerCarrito">Tiempo restante: 10:00</p>
        <button id="btnVaciar">Vaciar</button>
        <button id="btnComprar">Comprar</button>

    </div>

    <main>
        <button id="volver">Volver</button>

        <h1 id="titulo"></h1>
        <img id="flyer" />

        <div class="info-texto">
            <p id="precio"></p>
            <p id="info"></p>
            
            <div class="info-container" id="infoContainer"></div>
        </div>


    </main>

    <script src="js/clases.js"></script>
    <script src="js/carrito.js"></script>
    <script src="js/info.js"></script>

</body>
</html>
